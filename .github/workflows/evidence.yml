name: a rule change carries its cases

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: a change to what a rule says must change the cases with it
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="origin/$BASE_REF...HEAD"
          else
            range="$BEFORE..HEAD"
          fi
          if ! git rev-parse --verify --quiet "${range%%.*}^{commit}" >/dev/null; then
            echo "no commit to compare against ($range), so nothing was checked."
            echo "This check reads a diff; it cannot read one that does not exist."
            exit 0
          fi

          said=$(git diff -U0 "$range" -- 'src/law/**' \
                 | grep -E '^[+-][^+-]' \
                 | grep -E 'bans:|instead:|id: "' || true)
          rust=$(git diff -U0 "$range" -- 'vendor/rust-law/src/**' \
                 | grep -E '^[+-][^+-]' \
                 | grep -E 'Rule::|fn judge|violations\.push|help_for|bans' || true)
          python=$(git diff -U0 "$range" -- 'src/law/python/read.py' \
                   | grep -E '^[+-][^+-]' \
                   | grep -E 'PY-|isinstance|frozenset' || true)
          csharp=$(git diff -U0 "$range" -- 'vendor/csharp-law/src/**' \
                   | grep -E '^[+-][^+-]' \
                   | grep -E 'CS-|yield return At|case .*Syntax' || true)
          cases=$(git diff --name-only "$range" \
                  | grep -E '^audit/(cases|rust-cases|python-cases|csharp-cases|css-cases|copy-cases)\.ts$' || true)
          # STACK:1 is about a project rather than a file's text, so the case
          # harness in audit/ cannot express it. Its cases live beside it.
          stack=$(git diff -U0 "$range" -- 'src/law/stack.ts' \
                  | grep -E '^[+-][^+-]' | grep -E 'bans:|instead:|id: "' || true)
          stackCases=$(git diff --name-only "$range" \
                       | grep -E '^tests/stack\.test\.ts$' || true)
          if [ -n "$stack" ] && [ -n "$stackCases" ]; then
            said=$(echo "$said" | grep -v 'STACK' || true)
            cases="tests/stack.test.ts"
          fi

          if { [ -n "$said" ] || [ -n "$rust" ] || [ -n "$python" ] || [ -n "$csharp" ]; } && [ -z "$cases" ]; then
            echo "This changes what a rule says:"
            echo "$said$rust$python$csharp" | sed 's/^/  /' | head -20
            echo
            echo "and none of the case files under audit/ moved with it:"
            echo "  cases, rust-cases, python-cases, csharp-cases, css-cases, copy-cases"
            echo "A rule judged from a file's name rather than its text keeps its cases"
            echo "in tests/copy.test.ts, which needs a real directory to write them in.
            echo "A rule's cases are written first,"
            echo "from its own ban text: what must fire and what must stay silent."
            echo "A test written after the code can only agree with the code."
            echo
            echo "CONTRIBUTING.md, 'Changing a rule, or adding one', has the order."
            exit 1
          fi
          echo "no rule text changed, or the cases changed with it"
